version: '3.8'

# ============================================================
# VoiceDesk Local Demo & Development Compose Configuration
# Port 5180 (Frontend) -> Port 8000 (FastAPI Backend)
# Runs with DEMO_MODE=true and ENVIRONMENT=development
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: voicedesk-postgres
    restart: always
    environment:
      POSTGRES_USER: voicedesk
      POSTGRES_PASSWORD: voicedesk_dev_password_2026
      POSTGRES_DB: voicedesk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicedesk -d voicedesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: voicedesk-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://voicedesk:voicedesk_dev_password_2026@db:5432/voicedesk_db
      SECRET_KEY: carebridge-voicedesk-secret-key-2026-secure
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CareBridge2026!
      DEMO_MODE: "true"
      CLINIC_TIMEZONE: Asia/Kolkata
      ENVIRONMENT: development
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: voicedesk-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5180:80"

  voice-worker:
    build:
      context: .
      dockerfile: Dockerfile.voice
    container_name: voicedesk-voice-worker
    restart: always
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000/api
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

volumes:
  postgres_data:
